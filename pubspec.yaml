name: fitlab_mobile2
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  device_preview: ^1.3.1
  provider: ^6.1.5+1
  mask_text_input_formatter: ^2.9.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_svg: ^2.0.10+1
  device_preview_plus: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true

flutter:
